name: sast-triage
description: "Semgrep review for Python, JavaScript and TypeScript: labels findings new or pre-existing, ranks them P1-P3 and fails only on new P1 findings."
branding:
  icon: shield
  color: purple
inputs:
  path:
    description: Directory to scan (the repository checkout by default)
    default: .
  base:
    description: >-
      Git ref to compare with, so only changed files are scanned and findings on unchanged lines are
      pre-existing. Defaults to the pull request's base branch on pull_request events, and to a full
      scan (every finding new) otherwise; "none" always runs a full scan. Needs the base's history:
      check out with fetch-depth 0.
    default: ""
  timeout:
    description: >-
      Scanner time limit in seconds, a whole number, passed to scan_repo.py as --timeout. Empty keeps
      its default of 300 seconds. A value that is not a whole number stops the step with exit status 2
      and no result.
    default: ""
  sarif:
    description: >-
      File to also write the findings to as SARIF 2.1.0, passed to scan_repo.py as --sarif. A relative
      path is relative to the workspace. Empty writes no SARIF file. The file is written only when the
      scan issues a result (exit status 0 or 1): a scan that stops with exit status 2 creates no file
      and leaves an existing one unchanged. Uploading the file is a separate step of your workflow.
    default: ""
runs:
  using: composite
  steps:
    - name: Install the scanner
      shell: bash
      run: |
        python3 -I -m venv "$RUNNER_TEMP/sast-triage-venv"
        "$RUNNER_TEMP/sast-triage-venv/bin/python" -I -m pip install --quiet --disable-pip-version-check \
          -r "$GITHUB_ACTION_PATH/requirements-cli.txt"
    - name: Scan
      shell: bash
      env:
        SAST_PATH: ${{ inputs.path }}
        SAST_BASE: ${{ inputs.base }}
        SAST_TIMEOUT: ${{ inputs.timeout }}
        SAST_SARIF: ${{ inputs.sarif }}
      run: |
        base="$SAST_BASE"
        if [ -z "$base" ] && [ -n "${GITHUB_BASE_REF:-}" ]; then base="origin/$GITHUB_BASE_REF"; fi
        if [ "$base" = "none" ]; then base=""; fi
        args=("$SAST_PATH" --markdown "$RUNNER_TEMP/sast-triage.md")
        if [ -n "$base" ]; then args+=(--base "$base"); fi
        if [ -n "$SAST_TIMEOUT" ]; then args+=(--timeout "$SAST_TIMEOUT"); fi
        if [ -n "$SAST_SARIF" ]; then args+=(--sarif "$SAST_SARIF"); fi
        rm -f "$RUNNER_TEMP/sast-triage.md"
        set +e
        "$RUNNER_TEMP/sast-triage-venv/bin/python" "$GITHUB_ACTION_PATH/scan_repo.py" "${args[@]}"
        code=$?
        set -e
        if [ -f "$RUNNER_TEMP/sast-triage.md" ]; then cat "$RUNNER_TEMP/sast-triage.md" >> "$GITHUB_STEP_SUMMARY"; fi
        exit $code
